spring.application.name=Quiniela
server.port=8080

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=QuinielaDB;encrypt=true;trustServerCertificate=true
#Hay que agregar el usuario para acceder a la base de datos, no sé si usan root
spring.datasource.username=sa
#Hay que agregar la contraseña de la base de datos, no sé si usan root
spring.datasource.password=TU_PASSWORD
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false