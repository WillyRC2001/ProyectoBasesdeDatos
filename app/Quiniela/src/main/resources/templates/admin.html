<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <style>
        body { background: linear-gradient(135deg, #198754, #0d6efd); min-height: 100vh; }
        .custom-navbar { background: rgba(0,0,0,0.25); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.1); padding-top: 12px; padding-bottom: 12px; transition: 0.3s; }
        .custom-navbar.scrolled { background: rgba(0,0,0,0.45); box-shadow: 0 4px 20px rgba(0,0,0,0.25); }
        .navbar-brand { color: white !important; font-size: 1.5rem; font-weight: bold; }
        .navbar-brand i { color: #8dffb1; }
        .brand-text { background: linear-gradient(to right, #ffffff, #d8f3ff); background-clip: text; -webkit-background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
        .welcome-title { color: white; font-weight: bold; font-size: 2.2rem; text-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .welcome-sub { color: rgba(255,255,255,0.75); font-size: 1.1rem; }
        .admin-card { background: rgba(255,255,255,0.15); backdrop-filter: blur(12px); border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 8px 25px rgba(0,0,0,0.2); color: white; text-align: center; padding: 35px 20px; transition: 0.3s; text-decoration: none; display: block; }
        .admin-card:hover { transform: translateY(-5px); box-shadow: 0 12px 30px rgba(0,0,0,0.3); color: white; background: rgba(255,255,255,0.22); }
        .admin-card i { font-size: 2.8rem; color: #8dffb1; margin-bottom: 15px; display: block; }
        .admin-card h5 { color: white; font-weight: bold; font-size: 1.2rem; margin-bottom: 8px; }
        .admin-card p { color: rgba(255,255,255,0.7); font-size: 0.9rem; margin: 0; }
        .btn-logout { border-radius: 12px; padding: 8px 16px; font-weight: bold; border: 1px solid rgba(255,255,255,0.4); color: white; background: transparent; transition: 0.2s; }
        .btn-logout:hover { background: rgba(255,255,255,0.15); color: white; }
        .user-badge { color: rgba(255,255,255,0.9); font-size: 0.95rem; }
        .section-title { color: white; font-weight: bold; font-size: 1.4rem; margin-bottom: 20px; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg fixed-top custom-navbar">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/admin}">
            <i class="bi bi-shield-lock-fill me-2"></i>
            <span class="brand-text">Panel Admin</span>
        </a>
        <div class="d-flex align-items-center gap-3">
            <span class="user-badge"><i class="bi bi-person-circle me-1"></i><span sec:authentication="name"></span></span>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn-logout"><i class="bi bi-box-arrow-right me-1"></i>Cerrar sesión</button>
            </form>
        </div>
    </div>
</nav>

<div style="margin-top: 100px;"></div>

<div class="container pb-5">
    <div class="mb-5 animate__animated animate__fadeInDown">
        <h1 class="welcome-title"><i class="bi bi-shield-check me-2"></i>Bienvenido, <span sec:authentication="name"></span>!</h1>
        <p class="welcome-sub">Panel de administración del sistema de quinielas.</p>
    </div>

    <h2 class="section-title animate__animated animate__fadeIn"><i class="bi bi-grid me-2"></i>Gestión del sistema</h2>

    <div class="row g-4">
        <div class="col-md-4 animate__animated animate__fadeInUp">
            <a th:href="@{/admin/usuarios}" class="admin-card">
                <i class="bi bi-people-fill"></i>
                <h5>Usuarios</h5>
                <p>Ver todos los jugadores registrados</p>
            </a>
        </div>
        <div class="col-md-4 animate__animated animate__fadeInUp" style="animation-delay: 0.1s;">
            <a th:href="@{/admin/partidos}" class="admin-card">
                <i class="bi bi-calendar-event-fill"></i>
                <h5>Partidos</h5>
                <p>Actualizar resultados de partidos</p>
            </a>
        </div>
        <div class="col-md-4 animate__animated animate__fadeInUp" style="animation-delay: 0.2s;">
            <a th:href="@{/admin/quinielas}" class="admin-card">
                <i class="bi bi-trophy-fill"></i>
                <h5>Quinielas</h5>
                <p>Ver rankings y gestionar quinielas</p>
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const navbar = document.querySelector('.custom-navbar');
    window.addEventListener('scroll', () => { navbar.classList.toggle('scrolled', window.scrollY > 20); });
</script>
</body>
</html>
