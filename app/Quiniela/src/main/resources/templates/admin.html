<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" th:href="@{/admin}">
                Panel de Administración
            </a>
            <div class="d-flex align-items-center gap-3">
                <span class="text-white" sec:authentication="name"></span>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
                </form>
            </div>
        </div>
    </nav>

    <!-- ESPACIO POR NAVBAR FIJA -->
    <div style="margin-top: 80px;"></div>

    <div class="container">

        <div class="row justify-content-center">
            <div class="col-md-8">

                <h1 class="mb-4">Bienvenido, <span sec:authentication="name"></span>!</h1>
                <p class="text-muted">Estás en el panel de administración.</p>

                <div class="row mt-4">
                    <div class="col-md-4">
                        <div class="card text-center p-3">
                            <h5>Usuarios</h5>
                            <p class="text-muted">Gestionar usuarios</p>
                            <a th:href="@{/admin/usuarios}" class="btn btn-primary btn-sm">Ver usuarios</a>
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
