<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Partidos - Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background: linear-gradient(135deg, #198754, #0d6efd); min-height: 100vh; color: white; }
    .custom-navbar { background: rgba(0,0,0,0.25); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.1); padding: 12px 0; }
    .navbar-brand, .btn-link-light { color: white !important; }
    .panel { background: rgba(255,255,255,0.15); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.2); border-radius: 18px; box-shadow: 0 8px 25px rgba(0,0,0,0.2); }
    .form-control, .form-select { border-radius: 10px; border: 0; }
    .table > :not(caption) > * > * { background-color: transparent !important; color: white !important; border-color: rgba(255,255,255,0.12); vertical-align: middle; }
    .badge-soft { border: 1px solid rgba(255,255,255,0.28); background: rgba(255,255,255,0.12); }
  </style>
</head>
<body>
<nav class="navbar fixed-top custom-navbar">
  <div class="container">
    <a class="navbar-brand fw-bold" th:href="@{/admin}"><i class="bi bi-shield-lock-fill me-2"></i>Panel Admin</a>
    <div class="d-flex align-items-center gap-3">
      <span><i class="bi bi-person-circle me-1"></i><span sec:authentication="name"></span></span>
      <form th:action="@{/logout}" method="post"><button class="btn btn-outline-light btn-sm" type="submit">Cerrar sesión</button></form>
    </div>
  </div>
</nav>

<div class="container pb-5" style="margin-top: 100px;">
  <a th:href="@{/admin}" class="btn btn-outline-light mb-4"><i class="bi bi-arrow-left me-1"></i>Volver al panel</a>
  <h1 class="fw-bold mb-4"><i class="bi bi-calendar-event-fill me-2"></i>Gestión de Partidos</h1>

  <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <section class="panel p-4 mb-4">
    <h2 class="h5 fw-bold mb-3"><i class="bi bi-plus-circle me-2"></i>Agregar partido nuevo</h2>
    <form th:action="@{/admin/partidos}" method="post" class="row g-3">
      <div class="col-md-3">
        <label class="form-label">Fecha y hora</label>
        <input type="datetime-local" name="fechaHora" class="form-control" required>
      </div>
      <div class="col-md-3">
        <label class="form-label">Equipo local</label>
        <select name="equipoLocalId" class="form-select" required>
          <option value="">Seleccionar</option>
          <option th:each="equipo : ${equipos}" th:value="${equipo.idEquipo}" th:text="${equipo.nombreEquipo}"></option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Equipo visitante</label>
        <select name="equipoVisitanteId" class="form-select" required>
          <option value="">Seleccionar</option>
          <option th:each="equipo : ${equipos}" th:value="${equipo.idEquipo}" th:text="${equipo.nombreEquipo}"></option>
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label">Estado</label>
        <select name="estado" class="form-select">
          <option value="Pendiente">Pendiente</option>
          <option value="En curso">En curso</option>
          <option value="Finalizado">Finalizado</option>
        </select>
      </div>
      <div class="col-md-1 d-flex align-items-end">
        <button type="submit" class="btn btn-light w-100"><i class="bi bi-save"></i></button>
      </div>
    </form>
  </section>

  <section class="panel p-4">
    <div class="table-responsive">
      <table class="table align-middle">
        <thead>
        <tr>
          <th>#</th><th>Fecha</th><th>Local</th><th>Visitante</th><th>Estado</th><th>Resultado</th><th>Actualizar resultado</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="partido : ${partidos}">
          <td th:text="${partido.idPartido}"></td>
          <td th:text="${partido.fechaHora}"></td>
          <td><span th:each="p : ${partido.participaciones}" th:if="${p.localOVisitante == 'Local'}" th:text="${p.equipo.nombreEquipo}"></span></td>
          <td><span th:each="p : ${partido.participaciones}" th:if="${p.localOVisitante == 'Visitante'}" th:text="${p.equipo.nombreEquipo}"></span></td>
          <td><span class="badge badge-soft" th:text="${partido.estado}"></span></td>
          <td><span th:text="${partido.golesLocal != null ? partido.golesLocal : '-'}"></span> - <span th:text="${partido.golesVisitante != null ? partido.golesVisitante : '-'}"></span></td>
          <td>
            <form th:action="@{/admin/partidos/{id}/resultado(id=${partido.idPartido})}" method="post" class="d-flex gap-2">
              <input type="number" name="golesLocal" min="0" max="20" class="form-control" style="width:80px" required>
              <input type="number" name="golesVisitante" min="0" max="20" class="form-control" style="width:80px" required>
              <button type="submit" class="btn btn-success"><i class="bi bi-check2"></i></button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(partidos)}"><td colspan="7" class="text-center py-4">No hay partidos registrados.</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
