<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                Registro e inicio de sesión
            </a>
        </div>
    </nav>

    <div style="margin-top: 80px;"></div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div th:if="${param.exito}">
                    <div class="alert alert-info">
                        Se ha registrado exitosamente a la aplicación
                    </div>
                </div>

                <!-- Mensaje de error -->
                <div th:if="${error}">
                    <div class="alert alert-danger">
                        <p th:text="${error}"></p>
                    </div>
                </div>

                <h1 class="mb-4">Regístrate</h1>

                <form th:action="@{/registro}" method="post" th:object="${usuario}">

                    <!-- NOMBRE -->
                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control" th:field="*{nombre}" required />
                    </div>

                    <!-- SEGUNDO NOMBRE -->
                    <div class="mb-3">
                        <label class="form-label">Segundo Nombre <span class="text-muted">(opcional)</span></label>
                        <input type="text" class="form-control" th:field="*{segundoNombre}" />
                    </div>

                    <!-- PRIMER APELLIDO -->
                    <div class="mb-3">
                        <label class="form-label">Primer Apellido</label>
                        <input type="text" class="form-control" th:field="*{primerApellido}" required />
                    </div>

                    <!-- SEGUNDO APELLIDO -->
                    <div class="mb-3">
                        <label class="form-label">Segundo Apellido</label>
                        <input type="text" class="form-control" th:field="*{segundoApellido}" required />
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="usuario">Nombre de Usuario</label>
                        <input id="usuario" type="text" class="form-control" th:field="*{nombreUsuario}" required />
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="email">Correo</label>
                        <input id="email" type="email" class="form-control" th:field="*{correo}" required />
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="password">Contraseña</label>
                        <input id="password" type="password" class="form-control" th:field="*{contrasena}"
                            required />
                        <div class="form-text mt-1">
                            <span id="req-length" class="text-danger">✗ Mínimo 8 caracteres</span><br>
                            <span id="req-upper" class="text-danger">✗ Al menos una mayúscula</span><br>
                            <span id="req-number" class="text-danger">✗ Al menos un número</span><br>
                            <span id="req-special" class="text-danger">✗ Al menos un carácter especial</span>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="fechaNacimiento">Fecha de nacimiento</label>
                        <input id="fechaNacimiento" type="date" class="form-control" th:field="*{fechaNacimiento}"
                            required />
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success">Registrar</button>
                    </div>

                    <div class="mt-3 text-center">
                        <span>Si estás registrado</span>
                        <a th:href="@{/login}">inicia sesión aquí</a>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const password = document.getElementById('password');
        const reqLength = document.getElementById('req-length');
        const reqUpper = document.getElementById('req-upper');
        const reqNumber = document.getElementById('req-number');
        const reqSpecial = document.getElementById('req-special');

        function toggleReq(el, valid) {
            const texto = el.textContent.substring(2);
            if (valid) {
                el.classList.remove('text-danger');
                el.classList.add('text-success');
                el.textContent = '✓ ' + texto;
            } else {
                el.classList.remove('text-success');
                el.classList.add('text-danger');
                el.textContent = '✗ ' + texto;
            }
        }

        function passwordValida() {
            const val = password.value;
            return val.length >= 8 &&
                /[A-Z]/.test(val) &&
                /[0-9]/.test(val) &&
                /[!@#$%^&*()_+\-=\[\]{}:,.<>?]/.test(val);
        }

        password.addEventListener('input', () => {
            const val = password.value;
            toggleReq(reqLength, val.length >= 8);
            toggleReq(reqUpper, /[A-Z]/.test(val));
            toggleReq(reqNumber, /[0-9]/.test(val));
            toggleReq(reqSpecial, /[!@#$%^&*()_+\-=\[\]{}:,.<>?]/.test(val));
        });

        document.querySelector('form').addEventListener('submit', (e) => {
            if (!passwordValida()) {
                e.preventDefault(); // ← bloquea el envío
                password.focus();   // ← enfoca el campo contraseña
            }
        });
    </script>

</body>

</html>
