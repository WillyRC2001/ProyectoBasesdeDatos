<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usuarios - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <style>
        body { background: linear-gradient(135deg, #198754, #0d6efd); min-height: 100vh; }
        .custom-navbar { background: rgba(0,0,0,0.25); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.1); padding-top: 12px; padding-bottom: 12px; transition: 0.3s; }
        .custom-navbar.scrolled { background: rgba(0,0,0,0.45); box-shadow: 0 4px 20px rgba(0,0,0,0.25); }
        .navbar-brand { color: white !important; font-size: 1.5rem; font-weight: bold; }
        .navbar-brand i { color: #8dffb1; }
        .brand-text { background: linear-gradient(to right, #ffffff, #d8f3ff); background-clip: text; -webkit-background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
        .page-title { color: white; font-weight: bold; font-size: 2rem; text-shadow: 0 2px 8px rgba(0,0,0,0.2); }

        .table-card {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            overflow: hidden;
            color: white;
        }

        .table { margin: 0; color: white; background: transparent; }
        .table > :not(caption) > * > * {
            background-color: transparent !important;
            color: white !important;
        }
        .table tbody { background: transparent; }
        .table tbody tr { background: transparent; transition: 0.2s; }

        .table thead th {
            background-color: rgba(0,0,0,0.2) !important;
            color: rgba(255,255,255,0.85) !important;
            border-color: rgba(255,255,255,0.1);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 15px 20px;
        }
        .table tbody td {
            border-color: rgba(255,255,255,0.08);
            padding: 14px 20px;
            vertical-align: middle;
            color: white;
        }

        .table tbody tr:hover > td { background-color: rgba(255,255,255,0.08) !important; }

        .badge-admin { background: rgba(255,80,80,0.3); border: 1px solid rgba(255,120,120,0.4); color: #ffb3b3; border-radius: 8px; padding: 4px 12px; font-size: 0.8rem; }
        .badge-user { background: rgba(0,200,120,0.2); border: 1px solid rgba(0,255,170,0.3); color: #8dffb1; border-radius: 8px; padding: 4px 12px; font-size: 0.8rem; }
        .btn-back { border-radius: 12px; padding: 8px 20px; border: 1px solid rgba(255,255,255,0.4); color: white; background: transparent; transition: 0.2s; text-decoration: none; display: inline-block; }
        .btn-back:hover { background: rgba(255,255,255,0.15); color: white; }
        .btn-logout { border-radius: 12px; padding: 8px 16px; font-weight: bold; border: 1px solid rgba(255,255,255,0.4); color: white; background: transparent; transition: 0.2s; }
        .btn-logout:hover { background: rgba(255,255,255,0.15); color: white; }
        .user-badge { color: rgba(255,255,255,0.9); font-size: 0.95rem; }
        .empty-state { color: rgba(255,255,255,0.6); text-align: center; padding: 40px; }
        .empty-state i { font-size: 2.5rem; margin-bottom: 10px; display: block; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg fixed-top custom-navbar">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/admin}">
            <i class="bi bi-shield-lock-fill me-2"></i>
            <span class="brand-text">Panel Admin</span>
        </a>
        <div class="d-flex align-items-center gap-3">
            <span class="user-badge"><i class="bi bi-person-circle me-1"></i><span sec:authentication="name"></span></span>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn-logout"><i class="bi bi-box-arrow-right me-1"></i>Cerrar sesión</button>
            </form>
        </div>
    </div>
</nav>

<div style="margin-top: 100px;"></div>

<div class="container pb-5">
    <a th:href="@{/admin}" class="btn-back mb-4 animate__animated animate__fadeIn">
        <i class="bi bi-arrow-left me-1"></i>Volver al panel
    </a>

    <h1 class="page-title mb-4 mt-3 animate__animated animate__fadeInDown">
        <i class="bi bi-people-fill me-2"></i>Usuarios registrados
    </h1>

    <div class="table-card animate__animated animate__fadeInUp">
        <table class="table">
            <thead>
            <tr>
                <th>#</th>
                <th>Usuario</th>
                <th>Nombre completo</th>
                <th>Correo</th>
                <th>Fecha nacimiento</th>
                <th>Rol</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="usuario : ${usuarios}">
                <td th:text="${usuario.idUsuario}"></td>
                <td><i class="bi bi-person-circle me-2" style="color:#8dffb1;"></i><span th:text="${usuario.nombreUsuario}"></span></td>
                <td>
                            <span th:if="${usuario.nombreCompleto != null}"
                                  th:text="${usuario.nombreCompleto.nombre + ' ' + usuario.nombreCompleto.primerApellido}"></span>
                    <span th:if="${usuario.nombreCompleto == null}" class="text-white-50">—</span>
                </td>
                <td>
                            <span th:if="${usuario.correoElectronico != null}"
                                  th:text="${usuario.correoElectronico.correo}"></span>
                    <span th:if="${usuario.correoElectronico == null}" class="text-white-50">—</span>
                </td>
                <td th:text="${usuario.fechaNacimiento}"></td>
                <td>
                    <span th:if="${usuario.rolUsuario == 'ROLE_ADMIN'}" class="badge-admin">ADMIN</span>
                    <span th:if="${usuario.rolUsuario != 'ROLE_ADMIN'}" class="badge-user">JUGADOR</span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(usuarios)}">
                <td colspan="6">
                    <div class="empty-state">
                        <i class="bi bi-inbox"></i>
                        <p>No hay usuarios registrados.</p>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const navbar = document.querySelector('.custom-navbar');
    window.addEventListener('scroll', () => { navbar.classList.toggle('scrolled', window.scrollY > 20); });
</script>
</body>
</html>
