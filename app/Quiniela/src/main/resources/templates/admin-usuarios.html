<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Usuarios - Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background: linear-gradient(135deg, #198754, #0d6efd); min-height: 100vh; color: white; }
    .custom-navbar { background: rgba(0,0,0,0.25); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.1); padding: 12px 0; }
    .navbar-brand { color: white !important; }
    .table-card { background: rgba(255,255,255,0.15); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.2); border-radius: 18px; box-shadow: 0 8px 25px rgba(0,0,0,0.2); overflow: hidden; }
    .table > :not(caption) > * > * { background-color: transparent !important; color: white !important; border-color: rgba(255,255,255,0.12); vertical-align: middle; }
    .form-control, .form-select { border-radius: 10px; border: 0; min-width: 150px; }
  </style>
</head>
<body>
<nav class="navbar fixed-top custom-navbar">
  <div class="container">
    <a class="navbar-brand fw-bold" th:href="@{/admin}"><i class="bi bi-shield-lock-fill me-2"></i>Panel Admin</a>
    <div class="d-flex align-items-center gap-3">
      <span><i class="bi bi-person-circle me-1"></i><span sec:authentication="name"></span></span>
      <form th:action="@{/logout}" method="post"><button class="btn btn-outline-light btn-sm" type="submit">Cerrar sesión</button></form>
    </div>
  </div>
</nav>

<div class="container-fluid px-4 pb-5" style="margin-top: 100px;">
  <a th:href="@{/admin}" class="btn btn-outline-light mb-4"><i class="bi bi-arrow-left me-1"></i>Volver al panel</a>
  <h1 class="fw-bold mb-4"><i class="bi bi-people-fill me-2"></i>Usuarios registrados</h1>

  <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <div class="table-card">
    <div class="table-responsive">
      <table class="table align-middle mb-0">
        <thead>
        <tr>
          <th>#</th><th>Usuario</th><th>Correo</th><th>Fecha nacimiento</th><th>Rol</th><th>Nueva contraseña</th><th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="usuario : ${usuarios}">
          <td th:text="${usuario.idUsuario}"></td>
          <td><input name="nombreUsuario" th:attr="form=${'editarUsuario' + usuario.idUsuario}" class="form-control" th:value="${usuario.nombreUsuario}" required></td>
          <td><input type="email" name="correo" th:attr="form=${'editarUsuario' + usuario.idUsuario}" class="form-control" th:value="${usuario.correoElectronico != null ? usuario.correoElectronico.correo : ''}"></td>
          <td><input type="date" name="fechaNacimiento" th:attr="form=${'editarUsuario' + usuario.idUsuario}" class="form-control" th:value="${usuario.fechaNacimiento}" required></td>
          <td>
            <select name="rolUsuario" th:attr="form=${'editarUsuario' + usuario.idUsuario}" class="form-select">
              <option value="ROLE_USER" th:selected="${usuario.rolUsuario != 'ROLE_ADMIN'}">ROLE_USER</option>
              <option value="ROLE_ADMIN" th:selected="${usuario.rolUsuario == 'ROLE_ADMIN'}">ROLE_ADMIN</option>
            </select>
          </td>
          <td><input type="password" name="contrasena" th:attr="form=${'editarUsuario' + usuario.idUsuario}" class="form-control" placeholder="Sin cambios"></td>
          <td>
            <form th:id="${'editarUsuario' + usuario.idUsuario}" th:action="@{/admin/usuarios/{id}/editar(id=${usuario.idUsuario})}" method="post"></form>
            <div class="d-flex gap-2">
              <button type="submit" th:attr="form=${'editarUsuario' + usuario.idUsuario}" class="btn btn-success"><i class="bi bi-save me-1"></i>Guardar</button>
              <form th:action="@{/admin/usuarios/{id}/eliminar(id=${usuario.idUsuario})}" method="post" onsubmit="return confirm('¿Eliminar este usuario?');">
                <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-1"></i>Eliminar</button>
              </form>
            </div>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(usuarios)}"><td colspan="7" class="text-center py-4">No hay usuarios registrados.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
