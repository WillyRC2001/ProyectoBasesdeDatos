<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ranking - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <style>
        body { background: linear-gradient(135deg, #198754, #0d6efd); min-height: 100vh; }
        .custom-navbar { background: rgba(0,0,0,0.25); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.1); padding-top: 12px; padding-bottom: 12px; transition: 0.3s; }
        .custom-navbar.scrolled { background: rgba(0,0,0,0.45); box-shadow: 0 4px 20px rgba(0,0,0,0.25); }
        .navbar-brand { color: white !important; font-size: 1.5rem; font-weight: bold; }
        .navbar-brand i { color: #8dffb1; }
        .brand-text { background: linear-gradient(to right, #ffffff, #d8f3ff); background-clip: text; -webkit-background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
        .page-title { color: white; font-weight: bold; font-size: 2rem; text-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .page-subtitle { color: rgba(255,255,255,0.7); font-size: 1rem; }
        .ranking-card { background: rgba(255,255,255,0.15); backdrop-filter: blur(12px); border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 8px 25px rgba(0,0,0,0.2); overflow: hidden; }
        .ranking-header { background: rgba(0,0,0,0.2); padding: 15px 25px; color: rgba(255,255,255,0.7); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; display: grid; grid-template-columns: 80px 1fr 120px; gap: 10px; }
        .ranking-row { padding: 18px 25px; display: grid; grid-template-columns: 80px 1fr 120px; gap: 10px; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08); transition: 0.2s; color: white; }
        .ranking-row:last-child { border-bottom: none; }
        .ranking-row:hover { background: rgba(255,255,255,0.08); }
        .ranking-row.primer-lugar { background: rgba(255,215,0,0.1); border-left: 3px solid rgba(255,215,0,0.6); }
        .ranking-row.segundo-lugar { background: rgba(192,192,192,0.1); border-left: 3px solid rgba(192,192,192,0.5); }
        .ranking-row.tercer-lugar { background: rgba(205,127,50,0.1); border-left: 3px solid rgba(205,127,50,0.5); }
        .posicion { font-weight: bold; font-size: 1.1rem; text-align: center; }
        .medalla-1 { color: #ffd700; font-size: 1.4rem; }
        .medalla-2 { color: #c0c0c0; font-size: 1.4rem; }
        .medalla-3 { color: #cd7f32; font-size: 1.4rem; }
        .jugador-nombre { font-weight: bold; }
        .jugador-sub { color: rgba(255,255,255,0.5); font-size: 0.8rem; }
        .puntos { font-weight: bold; font-size: 1.2rem; color: #8dffb1; text-align: right; }
        .puntos-label { color: rgba(255,255,255,0.5); font-size: 0.75rem; }
        .btn-back { border-radius: 12px; padding: 8px 20px; border: 1px solid rgba(255,255,255,0.4); color: white; background: transparent; transition: 0.2s; text-decoration: none; display: inline-block; }
        .btn-back:hover { background: rgba(255,255,255,0.15); color: white; }
        .btn-logout { border-radius: 12px; padding: 8px 16px; font-weight: bold; border: 1px solid rgba(255,255,255,0.4); color: white; background: transparent; transition: 0.2s; }
        .btn-logout:hover { background: rgba(255,255,255,0.15); color: white; }
        .user-badge { color: rgba(255,255,255,0.9); font-size: 0.95rem; }
        .custom-alert-info { background: rgba(0,255,170,0.12); border: 1px solid rgba(0,255,170,0.25); color: #d9fff3; backdrop-filter: blur(10px); border-radius: 15px; padding: 18px; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg fixed-top custom-navbar">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/admin}">
            <i class="bi bi-shield-lock-fill me-2"></i>
            <span class="brand-text">Panel Admin</span>
        </a>
        <div class="d-flex align-items-center gap-3">
            <span class="user-badge"><i class="bi bi-person-circle me-1"></i><span sec:authentication="name"></span></span>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn-logout"><i class="bi bi-box-arrow-right me-1"></i>Cerrar sesión</button>
            </form>
        </div>
    </div>
</nav>

<div style="margin-top: 100px;"></div>

<div class="container pb-5">
    <a th:href="@{/admin/quinielas}" class="btn-back mb-4 animate__animated animate__fadeIn">
        <i class="bi bi-arrow-left me-1"></i>Volver a quinielas
    </a>

    <div class="mb-4 mt-3 animate__animated animate__fadeInDown">
        <h1 class="page-title"><i class="bi bi-bar-chart-fill me-2"></i>Ranking</h1>
        <p class="page-subtitle" th:text="${quiniela.nombreQuiniela}"></p>
    </div>

    <div th:if="${#lists.isEmpty(ranking)}" class="custom-alert-info animate__animated animate__fadeIn">
        <div class="d-flex align-items-center">
            <i class="bi bi-info-circle-fill me-3 fs-4"></i>
            <div>Aún no hay puntos calculados para esta quiniela. Los puntos se calculan automáticamente cuando se actualiza el resultado de un partido.</div>
        </div>
    </div>

    <div th:if="${!#lists.isEmpty(ranking)}" class="ranking-card animate__animated animate__fadeInUp">
        <div class="ranking-header">
            <span>Posición</span>
            <span>Jugador</span>
            <span style="text-align:right;">Puntos</span>
        </div>

        <div th:each="entrada : ${ranking}"
             th:classappend="${entrada.posicion == 1} ? 'primer-lugar' : (${entrada.posicion == 2} ? 'segundo-lugar' : (${entrada.posicion == 3} ? 'tercer-lugar' : ''))"
             class="ranking-row">

            <div class="posicion">
                <span th:if="${entrada.posicion == 1}" class="medalla-1">🥇</span>
                <span th:if="${entrada.posicion == 2}" class="medalla-2">🥈</span>
                <span th:if="${entrada.posicion == 3}" class="medalla-3">🥉</span>
                <span th:if="${entrada.posicion > 3}" th:text="${entrada.posicion}"></span>
            </div>

            <div>
                <div class="jugador-nombre">
                    <i class="bi bi-person-circle me-2" style="color:#8dffb1;"></i>
                    <span th:text="${entrada.nombreUsuario}"></span>
                </div>
            </div>

            <div class="text-end">
                <div class="puntos" th:text="${entrada.puntosTotal}"></div>
                <div class="puntos-label">puntos</div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const navbar = document.querySelector('.custom-navbar');
    window.addEventListener('scroll', () => { navbar.classList.toggle('scrolled', window.scrollY > 20); });
</script>
</body>
</html>
