<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quinielas - Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background: linear-gradient(135deg, #198754, #0d6efd); min-height: 100vh; color: white; }
    .custom-navbar { background: rgba(0,0,0,0.25); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.1); padding: 12px 0; }
    .navbar-brand { color: white !important; }
    .panel, .quiniela-card { background: rgba(255,255,255,0.15); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.2); border-radius: 18px; box-shadow: 0 8px 25px rgba(0,0,0,0.2); }
    .form-control, .form-select { border-radius: 10px; border: 0; }
    .badge-abierta { background: rgba(0,200,120,0.25); color: #bfffe0; border: 1px solid rgba(0,255,170,0.35); }
    .badge-cerrada { background: rgba(255,80,80,0.25); color: #ffd1d1; border: 1px solid rgba(255,120,120,0.35); }
    .modal-content { background: #113c50; color: white; }
  </style>
</head>
<body>
<nav class="navbar fixed-top custom-navbar">
  <div class="container">
    <a class="navbar-brand fw-bold" th:href="@{/admin}"><i class="bi bi-shield-lock-fill me-2"></i>Panel Admin</a>
    <div class="d-flex align-items-center gap-3">
      <span><i class="bi bi-person-circle me-1"></i><span sec:authentication="name"></span></span>
      <form th:action="@{/logout}" method="post"><button class="btn btn-outline-light btn-sm" type="submit">Cerrar sesión</button></form>
    </div>
  </div>
</nav>

<div class="container pb-5" style="margin-top: 100px;">
  <a th:href="@{/admin}" class="btn btn-outline-light mb-4"><i class="bi bi-arrow-left me-1"></i>Volver al panel</a>
  <h1 class="fw-bold mb-4"><i class="bi bi-trophy-fill me-2"></i>Gestión de Quinielas</h1>

  <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <section class="panel p-4 mb-4">
    <h2 class="h5 fw-bold mb-3"><i class="bi bi-plus-circle me-2"></i>Agregar nueva quiniela</h2>
    <form th:action="@{/admin/quinielas}" method="post" class="row g-3">
      <div class="col-md-4"><label class="form-label">Nombre</label><input name="nombreQuiniela" class="form-control" required></div>
      <div class="col-md-4"><label class="form-label">Modalidad</label><input name="modalidad" class="form-control" required></div>
      <div class="col-md-4"><label class="form-label">Tipo puntuación</label><input name="tipoPuntuacion" class="form-control" required></div>
      <div class="col-md-6"><label class="form-label">Descripción</label><textarea name="descripcion" class="form-control" rows="2"></textarea></div>
      <div class="col-md-6"><label class="form-label">Reglas generales</label><textarea name="reglasGenerales" class="form-control" rows="2"></textarea></div>
      <div class="col-md-3"><label class="form-label">Inicio</label><input type="date" name="fechaInicio" class="form-control" required></div>
      <div class="col-md-3"><label class="form-label">Fin</label><input type="date" name="fechaFin" class="form-control" required></div>
      <div class="col-md-3"><label class="form-label">Estado</label><select name="estado" class="form-select"><option value="Abierta">Abierta</option><option value="Cerrada">Cerrada</option><option value="Finalizada">Finalizada</option></select></div>
      <div class="col-md-3"><label class="form-label">Partidos</label><select name="partidosIds" class="form-select" multiple><option th:each="partido : ${partidos}" th:value="${partido.idPartido}" th:text="${'Partido #' + partido.idPartido + ' - ' + partido.fechaHora}"></option></select></div>
      <div class="col-12"><button type="submit" class="btn btn-light"><i class="bi bi-save me-1"></i>Guardar quiniela</button></div>
    </form>
  </section>

  <div class="row g-4">
    <div class="col-md-6" th:each="quiniela : ${quinielas}">
      <div class="quiniela-card p-4 h-100">
        <div class="d-flex justify-content-between align-items-start mb-3">
          <h2 class="h5 fw-bold mb-0" th:text="${quiniela.nombreQuiniela}"></h2>
          <span th:classappend="${quiniela.estado == 'Abierta'} ? 'badge-abierta' : 'badge-cerrada'" class="badge" th:text="${quiniela.estado}"></span>
        </div>
        <p class="text-white-50" th:text="${quiniela.descripcion}"></p>
        <div class="small text-white-50 mb-3">
          <div>Inicio: <span th:text="${quiniela.fechaInicio}"></span></div>
          <div>Fin: <span th:text="${quiniela.fechaFin}"></span></div>
          <div>Modalidad: <span th:text="${quiniela.modalidad}"></span></div>
          <div>Puntuación: <span th:text="${quiniela.tipoPuntuacion}"></span></div>
        </div>
        <div class="d-flex gap-2 flex-wrap">
          <a th:href="@{/admin/quinielas/{id}/ranking(id=${quiniela.idQuiniela})}" class="btn btn-primary"><i class="bi bi-bar-chart-fill me-1"></i>Ranking</a>
          <button type="button" class="btn btn-light" data-bs-toggle="modal" th:attr="data-bs-target=${'#editarQuiniela' + quiniela.idQuiniela}"><i class="bi bi-pencil-square me-1"></i>Editar</button>
          <form th:if="${quiniela.estado != 'Cerrada'}" th:action="@{/admin/quinielas/{id}/cerrar(id=${quiniela.idQuiniela})}" method="post"><button class="btn btn-warning" type="submit"><i class="bi bi-lock-fill me-1"></i>Cerrar</button></form>
        </div>
      </div>

      <div class="modal fade" th:id="${'editarQuiniela' + quiniela.idQuiniela}" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
          <div class="modal-content">
            <form th:action="@{/admin/quinielas/{id}/editar(id=${quiniela.idQuiniela})}" method="post">
              <div class="modal-header"><h5 class="modal-title">Editar quiniela</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
              <div class="modal-body row g-3">
                <div class="col-md-4"><label class="form-label">Nombre</label><input name="nombreQuiniela" class="form-control" th:value="${quiniela.nombreQuiniela}" required></div>
                <div class="col-md-4"><label class="form-label">Modalidad</label><input name="modalidad" class="form-control" th:value="${quiniela.modalidad}" required></div>
                <div class="col-md-4"><label class="form-label">Tipo puntuación</label><input name="tipoPuntuacion" class="form-control" th:value="${quiniela.tipoPuntuacion}" required></div>
                <div class="col-md-6"><label class="form-label">Descripción</label><textarea name="descripcion" class="form-control" rows="2" th:text="${quiniela.descripcion}"></textarea></div>
                <div class="col-md-6"><label class="form-label">Reglas</label><textarea name="reglasGenerales" class="form-control" rows="2" th:text="${quiniela.reglasGenerales}"></textarea></div>
                <div class="col-md-3"><label class="form-label">Inicio</label><input type="date" name="fechaInicio" class="form-control" th:value="${quiniela.fechaInicio}" required></div>
                <div class="col-md-3"><label class="form-label">Fin</label><input type="date" name="fechaFin" class="form-control" th:value="${quiniela.fechaFin}" required></div>
                <div class="col-md-3"><label class="form-label">Estado</label><select name="estado" class="form-select"><option value="Abierta" th:selected="${quiniela.estado == 'Abierta'}">Abierta</option><option value="Cerrada" th:selected="${quiniela.estado == 'Cerrada'}">Cerrada</option><option value="Finalizada" th:selected="${quiniela.estado == 'Finalizada'}">Finalizada</option></select></div>
                <div class="col-md-3"><label class="form-label">Partidos</label><select name="partidosIds" class="form-select" multiple><option th:each="partido : ${partidos}" th:value="${partido.idPartido}" th:selected="${quiniela.partidoQuinielas != null and #lists.contains(quiniela.partidoQuinielas.![partido.idPartido], partido.idPartido)}" th:text="${'Partido #' + partido.idPartido + ' - ' + partido.fechaHora}"></option></select></div>
              </div>
              <div class="modal-footer"><button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancelar</button><button type="submit" class="btn btn-light">Guardar cambios</button></div>
            </form>
          </div>
        </div>
      </div>
    </div>
    <div th:if="${#lists.isEmpty(quinielas)}" class="col-12"><div class="quiniela-card p-5 text-center">No hay quinielas registradas.</div></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
