<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicio de sesion</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                Registro e inicio de sesión
            </a>
        </div>
    </nav>

    <!-- ESPACIO POR NAVBAR FIJA -->
    <div style="margin-top: 80px;"></div>

    <div class="container">

        <div class="row justify-content-center">
            <div class="col-md-6">

                <h1 class="mb-4">Inicio de sesion</h1>

                <form th:action="@{/login}" method="post">

                    <div th:if="${param.error}">
                        <div class="alert alert-danger">
                            Usuario o contraseña invalidos
                        </div>
                    </div>

                    <div th:if="${param.Logout}">
                        <div class="alert alert-info">
                            Se he cerrado la sesion de manera correcta.
                        </div>
                    </div>

                    <!-- USUARIO -->
                    <div class="mb-3">
                        <label class="form-label" for="usuario">Nombre de Usuario o email</label>
                        <input id="usuario" type="text" name="username" class="form-control" placeholder="Digite su usuario o email" required />
                    </div>

                    <!-- CONTRASEÑA -->
                    <div class="mb-3">
                        <label class="form-label" for="password">Contraseña</label>
                        <input id="password" type="password" name="password" class="form-control" placeholder="Digite su contraseña" required />
                    </div>

                    <!-- BOTÓN -->
                    <div class="d-grid gap-2">
                        <input type="submit" class="form-control btn btn-primary" id="Loging-submit" value = "Iniciar sesion">
                    </div>
                </form>

                <div class="mt-3 text-center">
                        <span>Si eres nuevo</span>
                        <a th:href="@{/registro}">Registrate aquí</a>
                    </div>

            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
