<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <style>
        body {
            background: linear-gradient(135deg, #198754, #0d6efd);
            min-height: 100vh;
        }

        .custom-navbar {
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 12px;
            padding-bottom: 12px;
            transition: 0.3s;
        }

        .custom-navbar.scrolled {
            background: rgba(0, 0, 0, 0.45);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        }

        .navbar-brand {
            color: white !important;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .navbar-brand i {
            color: #8dffb1;
        }

        .brand-text {
            background: linear-gradient(to right, #ffffff, #d8f3ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
        }

        .welcome-title {
            color: white;
            font-weight: bold;
            font-size: 2.2rem;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .welcome-sub {
            color: rgba(255, 255, 255, 0.75);
            font-size: 1.1rem;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            color: white;
            text-align: center;
            padding: 30px 20px;
            transition: 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }

        .stat-card i {
            font-size: 2.5rem;
            color: #8dffb1;
            margin-bottom: 10px;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: white;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }

        .section-title {
            color: white;
            font-weight: bold;
            font-size: 1.4rem;
            margin-bottom: 20px;
        }

        .quiniela-item {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px 20px;
            color: white;
            transition: 0.3s;
            text-decoration: none;
            display: block;
        }

        .quiniela-item:hover {
            transform: translateX(5px);
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .quiniela-item .nombre {
            font-weight: bold;
            font-size: 1rem;
        }

        .quiniela-item .descripcion {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.85rem;
        }

        .btn-quinielas {
            border-radius: 12px;
            padding: 12px 30px;
            font-weight: bold;
            font-size: 1.05rem;
            background: linear-gradient(135deg, #198754, #20c997);
            border: none;
            color: white;
            transition: 0.2s;
            text-decoration: none;
        }

        .btn-quinielas:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
            color: white;
        }

        .btn-logout {
            border-radius: 12px;
            padding: 8px 16px;
            font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            background: transparent;
            transition: 0.2s;
        }

        .btn-logout:hover {
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }

        .user-badge {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.95rem;
        }

        .empty-state {
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            padding: 30px;
        }

        .empty-state i {
            font-size: 2.5rem;
            margin-bottom: 10px;
            display: block;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg fixed-top custom-navbar">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
                <i class="bi bi-trophy-fill me-2"></i>
                <span class="brand-text">Quinielas</span>
            </a>
            <div class="d-flex align-items-center gap-3">
                <span class="user-badge">
                    <i class="bi bi-person-circle me-1"></i>
                    <span sec:authentication="name"></span>
                </span>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn-logout">
                        <i class="bi bi-box-arrow-right me-1"></i>Cerrar sesión
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <div style="margin-top: 100px;"></div>

    <div class="container pb-5">

        <!-- Bienvenida -->
        <div class="mb-5 animate__animated animate__fadeInDown">
            <h1 class="welcome-title">
                <i class="bi bi-hand-wave me-2"></i>Bienvenido(a), <span sec:authentication="name"></span>!
            </h1>
            <p class="welcome-sub">Aquí puedes ver tus quinielas y pronósticos.</p>
        </div>

        <!-- Estadísticas -->
        <div class="row g-4 mb-5">
            <div class="col-md-4 animate__animated animate__fadeInUp">
                <div class="stat-card">
                    <i class="bi bi-trophy d-block"></i>
                    <div class="stat-number" th:text="${#lists.size(inscripciones)}">0</div>
                    <div class="stat-label">Quinielas inscritas</div>
                </div>
            </div>
            <div class="col-md-4 animate__animated animate__fadeInUp">
                <div class="stat-card">
                    <i class="bi bi-pencil-square d-block"></i>
                    <div class="stat-number" th:text="${totalPronosticos}">0</div>
                    <div class="stat-label">Pronósticos realizados</div>
                </div>
            </div>
            <div class="col-md-4 animate__animated animate__fadeInUp">
                <div class="stat-card">
                    <i class="bi bi-search d-block"></i>
                    <div class="stat-number">+</div>
                    <div class="stat-label">Explorar quinielas</div>
                    <a th:href="@{/quinielas}" class="btn-quinielas btn mt-3">
                        <i class="bi bi-arrow-right me-1"></i>Ver quinielas
                    </a>
                </div>
            </div>
        </div>

        <!-- Mis quinielas -->
        <div class="animate__animated animate__fadeInUp">
            <h2 class="section-title">
                <i class="bi bi-list-check me-2"></i>Mis quinielas
            </h2>

            <div class="d-flex flex-column gap-3" th:if="${!#lists.isEmpty(inscripciones)}">
                <a th:each="inscripcion : ${inscripciones}"
                    th:href="@{/quinielas/{id}/pronosticos(id=${inscripcion.quiniela.idQuiniela})}"
                    class="quiniela-item">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <div class="nombre" th:text="${inscripcion.quiniela.nombreQuiniela}"></div>
                            <div class="descripcion" th:text="${inscripcion.quiniela.descripcion}"></div>
                        </div>
                        <div class="d-flex align-items-center gap-3">
                            <span class="badge bg-success" th:text="${inscripcion.quiniela.estado}"></span>
                            <i class="bi bi-chevron-right"></i>
                        </div>
                    </div>
                </a>
            </div>

            <div th:if="${#lists.isEmpty(inscripciones)}" class="empty-state">
                <i class="bi bi-inbox"></i>
                <p>No estás inscrito en ninguna quiniela.</p>
                <a th:href="@{/quinielas}" class="btn-quinielas btn mt-2">
                    <i class="bi bi-plus-circle me-1"></i>Explorar quinielas
                </a>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const navbar = document.querySelector('.custom-navbar');
        window.addEventListener('scroll', () => {
            navbar.classList.toggle('scrolled', window.scrollY > 20);
        });
    </script>

</body>

</html>
