<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ranking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <style>
        body { background: linear-gradient(135deg, #198754, #0d6efd); min-height: 100vh; }
        .custom-navbar { background: rgba(0,0,0,0.25); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.1); padding-top: 12px; padding-bottom: 12px; transition: 0.3s; }
        .custom-navbar.scrolled { background: rgba(0,0,0,0.45); box-shadow: 0 4px 20px rgba(0,0,0,0.25); }
        .navbar-brand { color: white !important; font-size: 1.5rem; font-weight: bold; }
        .navbar-brand i { color: #8dffb1; }
        .brand-text { background: linear-gradient(to right, #ffffff, #d8f3ff); background-clip: text; -webkit-background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
        .page-title { color: white; font-weight: bold; font-size: 2rem; text-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .table-card { background: rgba(255,255,255,0.15); backdrop-filter: blur(12px); border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 8px 25px rgba(0,0,0,0.2); overflow: hidden; }
        .table { margin: 0; color: white; background: transparent; }
        .table > :not(caption) > * > * { background-color: transparent !important; color: white !important; }
        .table thead th { background-color: rgba(0,0,0,0.2) !important; color: rgba(255,255,255,0.85) !important; border-color: rgba(255,255,255,0.1); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; padding: 15px 20px; }
        .table tbody td { border-color: rgba(255,255,255,0.08); padding: 14px 20px; vertical-align: middle; }
        .table tbody tr:hover > td { background-color: rgba(255,255,255,0.08) !important; }
        .fila-yo > td { background-color: rgba(0,255,170,0.12) !important; font-weight: bold; }
        .pos-1 { color: #FFD700; font-size: 1.3rem; }
        .pos-2 { color: #C0C0C0; font-size: 1.2rem; }
        .pos-3 { color: #CD7F32; font-size: 1.1rem; }
        .pos-otro { color: rgba(255,255,255,0.7); }
        .puntos-badge { background: rgba(0,255,170,0.2); border: 1px solid rgba(0,255,170,0.4); color: #d9fff3; border-radius: 10px; padding: 4px 14px; font-weight: bold; font-size: 1rem; }
        .yo-badge { background: rgba(0,255,170,0.3); border: 1px solid rgba(0,255,170,0.5); color: #d9fff3; border-radius: 8px; padding: 2px 10px; font-size: 0.75rem; margin-left: 8px; }
        .btn-back { border-radius: 12px; padding: 8px 20px; border: 1px solid rgba(255,255,255,0.4); color: white; background: transparent; transition: 0.2s; text-decoration: none; display: inline-block; }
        .btn-back:hover { background: rgba(255,255,255,0.15); color: white; }
        .btn-logout { border-radius: 12px; padding: 8px 16px; font-weight: bold; border: 1px solid rgba(255,255,255,0.4); color: white; background: transparent; transition: 0.2s; }
        .btn-logout:hover { background: rgba(255,255,255,0.15); color: white; }
        .user-badge { color: rgba(255,255,255,0.9); font-size: 0.95rem; }
        .empty-state { color: rgba(255,255,255,0.6); text-align: center; padding: 50px; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg fixed-top custom-navbar">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
            <i class="bi bi-trophy-fill me-2"></i>
            <span class="brand-text">Quinielas</span>
        </a>
        <div class="d-flex align-items-center gap-3">
            <span class="user-badge"><i class="bi bi-person-circle me-1"></i><span sec:authentication="name"></span></span>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn-logout"><i class="bi bi-box-arrow-right me-1"></i>Cerrar sesión</button>
            </form>
        </div>
    </div>
</nav>

<div style="margin-top: 100px;"></div>

<div class="container pb-5">
    <a th:href="@{/quinielas/{id}/pronosticos(id=${quiniela.idQuiniela})}"
       class="btn-back mb-4 animate__animated animate__fadeIn">
        <i class="bi bi-arrow-left me-1"></i>Volver a pronósticos
    </a>

    <h1 class="page-title mb-1 mt-3 animate__animated animate__fadeInDown">
        <i class="bi bi-bar-chart-fill me-2"></i>Ranking
    </h1>
    <p class="text-white-50 mb-4" th:text="${quiniela.nombreQuiniela}"></p>

    <div class="table-card animate__animated animate__fadeInUp">
        <table class="table">
            <thead>
            <tr>
                <th style="width:80px;">Posición</th>
                <th>Jugador</th>
                <th class="text-end">Puntos</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="entrada : ${ranking}"
                th:classappend="${entrada.nombreUsuario == usuarioActual} ? 'fila-yo' : ''">
                <td class="text-center">
                    <span th:if="${entrada.posicion == 1}" class="pos-1"><i class="bi bi-trophy-fill"></i></span>
                    <span th:if="${entrada.posicion == 2}" class="pos-2"><i class="bi bi-award-fill"></i></span>
                    <span th:if="${entrada.posicion == 3}" class="pos-3"><i class="bi bi-award-fill"></i></span>
                    <span th:if="${entrada.posicion > 3}" class="pos-otro" th:text="${entrada.posicion}"></span>
                </td>
                <td>
                    <i class="bi bi-person-circle me-2" style="color:#8dffb1;"></i>
                    <span th:text="${entrada.nombreUsuario}"></span>
                    <span th:if="${entrada.nombreUsuario == usuarioActual}" class="yo-badge">Tú</span>
                </td>
                <td class="text-end">
                    <span class="puntos-badge" th:text="${entrada.puntosTotal} + ' pts'"></span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(ranking)}">
                <td colspan="3">
                    <div class="empty-state">
                        <i class="bi bi-hourglass d-block mb-2" style="font-size:2rem;"></i>
                        <p>Aún no hay puntos calculados en esta quiniela.</p>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const navbar = document.querySelector('.custom-navbar');
    window.addEventListener('scroll', () => { navbar.classList.toggle('scrolled', window.scrollY > 20); });
</script>
</body>
</html>
