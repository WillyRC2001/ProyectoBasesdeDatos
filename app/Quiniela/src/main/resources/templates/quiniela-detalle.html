<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalle Quiniela</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <style>
        body {
            background: linear-gradient(135deg, #198754, #0d6efd);
            min-height: 100vh;
        }

        .custom-navbar {
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 12px;
            padding-bottom: 12px;
            transition: 0.3s;
        }

        .custom-navbar.scrolled {
            background: rgba(0, 0, 0, 0.45);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        }

        .navbar-brand {
            color: white !important;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .navbar-brand i {
            color: #8dffb1;
        }

        .brand-text {
            background: linear-gradient(to right, #ffffff, #d8f3ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
        }

        .page-title {
            color: white;
            font-weight: bold;
            font-size: 2rem;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .detail-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            color: white;
        }

        .detail-card h5 {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .detail-card p {
            color: white;
            font-size: 1rem;
        }

        .reglas-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 20px;
            color: rgba(255, 255, 255, 0.9);
        }

        .btn-inscribir {
            border-radius: 12px;
            padding: 12px 30px;
            font-weight: bold;
            font-size: 1.05rem;
            background: linear-gradient(135deg, #198754, #20c997);
            border: none;
            color: white;
            transition: 0.2s;
        }

        .btn-inscribir:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
            color: white;
        }

        .btn-pronosticos {
            border-radius: 12px;
            padding: 12px 30px;
            font-weight: bold;
            font-size: 1.05rem;
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            border: none;
            color: white;
            transition: 0.2s;
        }

        .btn-pronosticos:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
            color: white;
        }

        .btn-back {
            border-radius: 12px;
            padding: 8px 20px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            background: transparent;
            transition: 0.2s;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }

        .btn-logout {
            border-radius: 12px;
            padding: 8px 16px;
            font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            background: transparent;
            transition: 0.2s;
        }

        .btn-logout:hover {
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }

        .user-badge {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.95rem;
        }

        .inscrito-badge {
            background: rgba(0, 255, 170, 0.2);
            border: 1px solid rgba(0, 255, 170, 0.4);
            color: #d9fff3;
            border-radius: 12px;
            padding: 10px 20px;
        }

        .custom-alert-error {
            background: rgba(255, 80, 80, 0.15);
            border: 1px solid rgba(255, 120, 120, 0.4);
            color: #ffe3e3;
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .custom-alert-info {
            background: rgba(0, 255, 170, 0.12);
            border: 1px solid rgba(0, 255, 170, 0.25);
            color: #d9fff3;
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 18px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg fixed-top custom-navbar">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
                <i class="bi bi-trophy-fill me-2"></i>
                <span class="brand-text">Quinielas</span>
            </a>
            <div class="d-flex align-items-center gap-3">
                <span class="user-badge">
                    <i class="bi bi-person-circle me-1"></i>
                    <span sec:authentication="name"></span>
                </span>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn-logout">
                        <i class="bi bi-box-arrow-right me-1"></i>Cerrar sesión
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <div style="margin-top: 100px;"></div>

    <div class="container pb-5">

        <a th:href="@{/quinielas}" class="btn-back btn mb-4 animate__animated animate__fadeIn">
            <i class="bi bi-arrow-left me-1"></i>Volver a quinielas
        </a>

        <div th:if="${exito}">
            <div class="custom-alert-info animate__animated animate__fadeInDown">
                <div class="d-flex align-items-center">
                    <i class="bi bi-check-circle-fill me-3 fs-4"></i>
                    <div th:text="${exito}"></div>
                </div>
            </div>
        </div>

        <div th:if="${error}">
            <div class="custom-alert-error animate__animated animate__shakeX">
                <div class="d-flex align-items-center">
                    <i class="bi bi-exclamation-triangle-fill me-3 fs-4"></i>
                    <div th:text="${error}"></div>
                </div>
            </div>
        </div>

        <div class="detail-card p-4 mb-4 animate__animated animate__fadeInUp">

            <div class="d-flex justify-content-between align-items-start mb-4">
                <h1 class="page-title" th:text="${quiniela.nombreQuiniela}"></h1>
                <span class="badge bg-success fs-6" th:text="${quiniela.estado}"></span>
            </div>

            <div class="row g-4 mb-4">
                <div class="col-md-3">
                    <h5><i class="bi bi-calendar-event me-1"></i>Fecha inicio</h5>
                    <p th:text="${quiniela.fechaInicio}"></p>
                </div>
                <div class="col-md-3">
                    <h5><i class="bi bi-calendar-x me-1"></i>Fecha cierre</h5>
                    <p th:text="${quiniela.fechaFin}"></p>
                </div>
                <div class="col-md-3">
                    <h5><i class="bi bi-people me-1"></i>Modalidad</h5>
                    <p th:text="${quiniela.modalidad}"></p>
                </div>
                <div class="col-md-3">
                    <h5><i class="bi bi-star me-1"></i>Tipo puntuación</h5>
                    <p th:text="${quiniela.tipoPuntuacion}"></p>
                </div>
            </div>

            <div class="mb-4">
                <h5><i class="bi bi-info-circle me-1"></i>Descripción</h5>
                <p th:text="${quiniela.descripcion}"></p>
            </div>

            <div class="reglas-card mb-4">
                <h5 class="mb-3"><i class="bi bi-list-check me-1"></i>Reglas generales</h5>
                <p th:text="${quiniela.reglasGenerales}"></p>
            </div>

            <div class="d-flex gap-3 flex-wrap">

                <!-- No inscrito -->
                <div th:if="${!inscrito}">
                    <form th:action="@{/quinielas/{id}/inscribir(id=${quiniela.idQuiniela})}" method="post">
                        <button type="submit" class="btn-inscribir btn">
                            <i class="bi bi-person-plus me-1"></i>Inscribirme
                        </button>
                    </form>
                </div>

                <!-- Ya inscrito -->
                <div th:if="${inscrito}" class="d-flex align-items-center gap-3 flex-wrap">
                    <div class="inscrito-badge">
                        <i class="bi bi-check-circle-fill me-2"></i>Ya estás inscrito
                    </div>
                    <a th:href="@{/quinielas/{id}/pronosticos(id=${quiniela.idQuiniela})}" class="btn-pronosticos btn">
                        <i class="bi bi-pencil-square me-1"></i>Mis pronósticos
                    </a>
                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const navbar = document.querySelector('.custom-navbar');
        window.addEventListener('scroll', () => {
            navbar.classList.toggle('scrolled', window.scrollY > 20);
        });
    </script>

</body>

</html>
