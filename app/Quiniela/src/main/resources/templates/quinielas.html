<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quinielas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <style>
        body {
            background: linear-gradient(135deg, #198754, #0d6efd);
            min-height: 100vh;
        }

        .custom-navbar {
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 12px;
            padding-bottom: 12px;
            transition: 0.3s;
        }

        .custom-navbar.scrolled {
            background: rgba(0, 0, 0, 0.45);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        }

        .navbar-brand {
            color: white !important;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .navbar-brand i {
            font-size: 1.4rem;
            color: #8dffb1;
        }

        .brand-text {
            background: linear-gradient(to right, #ffffff, #d8f3ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
        }

        .page-title {
            color: white;
            font-weight: bold;
            font-size: 2rem;
            text-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .quiniela-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            transition: 0.3s;
            color: white;
        }

        .quiniela-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }

        .quiniela-card .card-title {
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .quiniela-card .card-text {
            color: rgba(255, 255, 255, 0.8);
        }

        .quiniela-card small {
            color: rgba(255, 255, 255, 0.7);
        }

        .btn-ver {
            border-radius: 12px;
            padding: 8px 20px;
            font-weight: bold;
            background: linear-gradient(135deg, #198754, #20c997);
            border: none;
            color: white;
            transition: 0.2s;
        }

        .btn-ver:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
            color: white;
        }

        .badge-estado {
            border-radius: 10px;
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        .custom-alert-error {
            background: rgba(255, 80, 80, 0.15);
            border: 1px solid rgba(255, 120, 120, 0.4);
            color: #ffe3e3;
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .custom-alert-info {
            background: rgba(0, 255, 170, 0.12);
            border: 1px solid rgba(0, 255, 170, 0.25);
            color: #d9fff3;
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .empty-state {
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            padding: 60px 0;
        }

        .empty-state i {
            font-size: 4rem;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 15px;
        }

        .btn-logout {
            border-radius: 12px;
            padding: 8px 16px;
            font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            background: transparent;
            transition: 0.2s;
        }

        .btn-logout:hover {
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }

        .user-badge {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.95rem;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg fixed-top custom-navbar">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
                <i class="bi bi-trophy-fill me-2"></i>
                <span class="brand-text">Quinielas</span>
            </a>
            <div class="d-flex align-items-center gap-3">
                <span class="user-badge">
                    <i class="bi bi-person-circle me-1"></i>
                    <span sec:authentication="name"></span>
                </span>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn-logout">
                        <i class="bi bi-box-arrow-right me-1"></i>Cerrar sesión
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <div style="margin-top: 100px;"></div>

    <div class="container pb-5">

        <h1 class="page-title mb-4 animate__animated animate__fadeInDown">
            <i class="bi bi-trophy me-2"></i>Quinielas disponibles
        </h1>

        <div th:if="${exito}">
            <div class="custom-alert-info animate__animated animate__fadeInDown">
                <div class="d-flex align-items-center">
                    <i class="bi bi-check-circle-fill me-3 fs-4"></i>
                    <div th:text="${exito}"></div>
                </div>
            </div>
        </div>

        <div th:if="${error}">
            <div class="custom-alert-error animate__animated animate__shakeX">
                <div class="d-flex align-items-center">
                    <i class="bi bi-exclamation-triangle-fill me-3 fs-4"></i>
                    <div th:text="${error}"></div>
                </div>
            </div>
        </div>

        <!-- Lista quinielas -->
        <div class="row g-4">
            <div class="col-md-4 animate__animated animate__fadeInUp" th:each="quiniela : ${quinielas}">
                <div class="quiniela-card card h-100 p-3">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h5 class="card-title" th:text="${quiniela.nombreQuiniela}"></h5>
                            <span class="badge bg-success badge-estado" th:text="${quiniela.estado}"></span>
                        </div>
                        <p class="card-text" th:text="${quiniela.descripcion}"></p>
                        <div class="mt-3">
                            <small><i class="bi bi-calendar-event me-1"></i>Inicio: <span th:text="${quiniela.fechaInicio}"></span></small><br>
                            <small><i class="bi bi-calendar-x me-1"></i>Cierre: <span th:text="${quiniela.fechaFin}"></span></small><br>
                            <small><i class="bi bi-people me-1"></i>Modalidad: <span th:text="${quiniela.modalidad}"></span></small>
                        </div>
                    </div>
                    <div class="card-footer bg-transparent border-0 pt-0">
                        <a th:href="@{/quinielas/{id}(id=${quiniela.idQuiniela})}" class="btn btn-ver w-100">
                            <i class="bi bi-eye me-1"></i>Ver detalle
                        </a>
                    </div>
                </div>
            </div>

            <!-- Sin quinielas -->
            <div th:if="${#lists.isEmpty(quinielas)}" class="col-12">
                <div class="empty-state animate__animated animate__fadeIn">
                    <i class="bi bi-inbox d-block"></i>
                    <p>No hay quinielas disponibles en este momento.</p>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const navbar = document.querySelector('.custom-navbar');
        window.addEventListener('scroll', () => {
            navbar.classList.toggle('scrolled', window.scrollY > 20);
        });
    </script>

</body>
</html>
